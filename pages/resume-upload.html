<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prep2Hire | Resume Upload</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css">


</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar navbar-expand-lg custom-navbar">

        <div class="container">

            <a
                class="navbar-brand logo-text fw-bold"
                href="../index.html">

                Prep2Hire

            </a>


            <a
                href="job-roles.html"
                class="btn btn-outline-primary rounded-pill">

                ← Back

            </a>

        </div>

    </nav>



    <!-- =========================
         RESUME UPLOAD SECTION
    ========================== -->

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">


                <div class="card shadow border-0 rounded-4 p-5">


                    <!-- Heading -->

                    <div class="text-center">

                        <i
                            class="bi bi-file-earmark-arrow-up display-1 text-primary">
                        </i>


                        <h2 class="fw-bold mt-3">

                            Upload Your Resume

                        </h2>


                        <p class="text-muted">

                            Upload your latest resume for
                            AI-based interview preparation.

                        </p>

                    </div>



                    <!-- =========================
                         FILE UPLOAD AREA
                    ========================== -->

                    <div
                        class="border border-2 border-primary rounded-4 p-5 text-center my-4">


                        <i
                            class="bi bi-cloud-arrow-up display-4 text-primary">
                        </i>


                        <h4 class="mt-3">

                            Select Your Resume

                        </h4>


                        <p class="text-muted">

                            PDF, DOC or DOCX files only

                        </p>


                        <input
                            type="file"
                            class="form-control"
                            id="resumeFile"
                            accept=".pdf,.doc,.docx">


                        <p class="mt-3 text-secondary">

                            Maximum file size: 5 MB

                        </p>

                    </div>



                    <!-- =========================
                         SELECTED FILE
                    ========================== -->

                    <div
                        class="alert alert-light border"
                        id="fileInfo">


                        <strong>

                            Selected File:

                        </strong>


                        <span id="fileName">

                            No file selected

                        </span>

                    </div>



                    <!-- =========================
                         VALIDATION MESSAGE
                    ========================== -->

                    <div
                        id="validationMessage"
                        class="alert d-none"
                        role="alert">

                    </div>



                    <!-- =========================
                         PROGRESS BAR
                    ========================== -->

                    <div class="progress mb-4">

                        <div
                            class="progress-bar progress-bar-striped progress-bar-animated"
                            id="progressBar"
                            role="progressbar"
                            style="width: 0%;">

                            0%

                        </div>

                    </div>



                    <!-- =========================
                         CONTINUE BUTTON
                    ========================== -->

                    <div class="d-grid">

                        <button
                            type="button"
                            id="continueBtn"
                            class="btn btn-primary btn-lg rounded-pill"
                            disabled>

                            Continue

                        </button>

                    </div>



                    <!-- Security / Information -->

                    <div class="text-center mt-4">

                        <small class="text-muted">

                            <i class="bi bi-shield-check"></i>

                            Your resume will be used for
                            personalized interview preparation.

                        </small>

                    </div>


                </div>

            </div>

        </div>

    </div>



    <!-- =========================
         PDF.JS
    ========================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>



    <!-- =========================
         BOOTSTRAP JS
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- =========================
         CUSTOM JS
    ========================== -->

    <script src="../js/script.js"></script>


</body>

</html>
