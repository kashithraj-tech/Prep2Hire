<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Prep2Hire | Reset Password</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>


<body>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div
                class="card
                       border-0
                       shadow
                       rounded-4
                       p-4">


                <!-- Logo -->

                <div class="text-center mb-4">

                    <a
                        href="../index.html"
                        class="text-decoration-none">

                        <h2
                            class="fw-bold text-primary">

                            Prep2Hire

                        </h2>

                    </a>


                    <p
                        class="text-muted">

                        Reset your account password

                    </p>

                </div>


                <!-- ================================================= -->
                <!-- EMAIL SECTION -->
                <!-- ================================================= -->

                <div id="emailSection">


                    <div class="mb-4">

                        <label
                            class="form-label fw-semibold">

                            Registered Email

                        </label>


                        <input
                            type="email"
                            id="resetEmail"
                            class="form-control"
                            placeholder="Enter your registered email"
                            required>

                    </div>


                    <button
                        type="button"
                        onclick="verifyEmail()"
                        class="btn
                               btn-primary
                               w-100
                               rounded-pill
                               py-2">

                        <i
                            class="bi bi-arrow-right-circle me-2">
                        </i>

                        Continue

                    </button>


                </div>



                <!-- ================================================= -->
                <!-- PASSWORD RESET SECTION -->
                <!-- ================================================= -->

                <div
                    id="passwordSection"
                    style="display: none;">


                    <div
                        class="alert
                               alert-success
                               rounded-3">

                        <i
                            class="bi bi-check-circle me-2">
                        </i>

                        Email verified successfully.

                        <br>

                        Create your new password below.

                    </div>


                    <!-- New Password -->

                    <div class="mb-3">

                        <label
                            class="form-label fw-semibold">

                            New Password

                        </label>


                        <input
                            type="password"
                            id="newPassword"
                            class="form-control"
                            placeholder="Enter new password">

                    </div>


                    <!-- Confirm Password -->

                    <div class="mb-4">

                        <label
                            class="form-label fw-semibold">

                            Confirm New Password

                        </label>


                        <input
                            type="password"
                            id="confirmNewPassword"
                            class="form-control"
                            placeholder="Confirm new password">

                    </div>


                    <button
                        type="button"
                        onclick="resetPassword()"
                        class="btn
                               btn-primary
                               w-100
                               rounded-pill
                               py-2">

                        <i
                            class="bi bi-shield-check me-2">
                        </i>

                        Reset Password

                    </button>


                </div>



                <!-- ================================================= -->
                <!-- BACK TO LOGIN -->
                <!-- ================================================= -->

                <div
                    class="text-center mt-4">

                    <a
                        href="login.html"
                        class="text-decoration-none">

                        ← Back to Login

                    </a>

                </div>


            </div>

        </div>

    </div>

</div>



<!-- ================================================= -->
<!-- AUTH JS -->
<!-- ================================================= -->

<script src="../js/auth.js"></script>


<script>


// ==========================================
// VERIFY EMAIL
// ==========================================

function verifyEmail() {


    const email =
        document
            .getElementById("resetEmail")
            .value
            .trim();


    if (!email) {

        alert(
            "Please enter your registered email."
        );

        return;

    }


    // Get all users

    const users =
        getUsers();


    // Find user

    const user =
        users.find(
            account =>

                account.email.toLowerCase() ===
                email.toLowerCase()
        );


    if (!user) {

        alert(
            "No account was found with this email address."
        );

        return;

    }


    // Store email temporarily

    sessionStorage.setItem(
        "prep2hireResetEmail",
        user.email
    );


    // Hide email section

    document
        .getElementById("emailSection")
        .style.display = "none";


    // Show password section

    document
        .getElementById("passwordSection")
        .style.display = "block";

}



// ==========================================
// RESET PASSWORD
// ==========================================

function resetPassword() {


    const newPassword =
        document
            .getElementById("newPassword")
            .value;


    const confirmPassword =
        document
            .getElementById("confirmNewPassword")
            .value;


    // Check password

    if (!newPassword || !confirmPassword) {

        alert(
            "Please enter and confirm your new password."
        );

        return;

    }


    // Minimum password length

    if (newPassword.length < 6) {

        alert(
            "Password must contain at least 6 characters."
        );

        return;

    }


    // Check passwords

    if (newPassword !== confirmPassword) {

        alert(
            "Passwords do not match."
        );

        return;

    }


    // Get reset email

    const resetEmail =
        sessionStorage.getItem(
            "prep2hireResetEmail"
        );


    if (!resetEmail) {

        alert(
            "Reset session expired. Please start again."
        );

        window.location.href =
            "forgot-password.html";

        return;

    }


    // Get all users

    const users =
        getUsers();


    // Find account

    const userIndex =
        users.findIndex(
            user =>

                user.email.toLowerCase() ===
                resetEmail.toLowerCase()
        );


    if (userIndex === -1) {

        alert(
            "Account not found."
        );

        return;

    }


    // Update password

    users[userIndex].password =
        newPassword;


    // Save users

    saveUsers(users);


    // Remove temporary reset session

    sessionStorage.removeItem(
        "prep2hireResetEmail"
    );


    // Success

    alert(
        "Password reset successfully! Please login with your new password."
    );


    // Go to login

    window.location.href =
        "login.html";

}


</script>


</body>

</html>
