<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Prep2Hire | Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>


<body>


<div class="container py-5">

    <div
        class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div
                class="card
                       border-0
                       shadow
                       rounded-4
                       p-4">


                <!-- Logo -->

                <div
                    class="text-center mb-4">

                    <a
                        href="../index.html"
                        class="text-decoration-none">

                        <h2
                            class="fw-bold text-primary">

                            Prep2Hire

                        </h2>

                    </a>


                    <p class="text-muted">

                        Login to your account

                    </p>

                </div>


                <!-- Login Form -->

                <form id="loginForm">


                    <!-- Email -->

                    <div class="mb-3">

                        <label
                            class="form-label fw-semibold">

                            Email

                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <!-- Password -->

                    <div class="mb-2">

                        <label
                            class="form-label fw-semibold">

                            Password

                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required>

                    </div>


                    <!-- Forgot Password -->

                    <div
                        class="text-end mb-4">

                        <a
                            href="forgot-password.html"
                            class="text-decoration-none">

                            Forgot Password?

                        </a>

                    </div>


                    <!-- Login -->

                    <button
                        type="submit"
                        class="btn
                               btn-primary
                               w-100
                               rounded-pill
                               py-2">

                        Login

                    </button>


                </form>


                <!-- Signup -->

                <div
                    class="text-center mt-4">

                    <span class="text-muted">

                        Don't have an account?

                    </span>

                    <a
                        href="signup.html"
                        class="text-primary fw-semibold">

                        Sign Up

                    </a>

                </div>


                <!-- Home -->

                <div
                    class="text-center mt-3">

                    <a
                        href="../index.html"
                        class="text-decoration-none">

                        ← Back to Home

                    </a>

                </div>


            </div>

        </div>

    </div>

</div>


<script src="../js/auth.js"></script>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            loginUser();

        }
    );

</script>


</body>

</html>
